name: Build posters on release

# Every pushed tag builds every format and attaches the PDFs to a GitHub release of that tag.
on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended texlive-science poppler-utils

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build the posters
        working-directory: 10-commandments
        run: just && just preview

      - name: Build the linear systems poster
        working-directory: linear-systems
        run: just

      - name: Build the loudspeaker poster
        working-directory: loudspeakers
        run: just

      - name: Build the screw drives slide
        working-directory: screw-drives
        run: just

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            10-commandments/ee-ten-commandments.pdf
            10-commandments/ee-ten-commandments-16x9.pdf
            10-commandments/ee-ten-commandments-slides.pdf
            10-commandments/preview.png
            linear-systems/lnas-poster.pdf
            screw-drives/screw-drives.pdf
            loudspeakers/loudspeaker-enclosures.pdf
          fail_on_unmatched_files: true
