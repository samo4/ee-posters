name: Build posters on release

# Every pushed tag builds both formats and attaches the PDFs to a GitHub release of that tag.
on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended texlive-science

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build the posters
        run: just

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ee-ten-commandments.pdf
            ee-ten-commandments-16x9.pdf
          fail_on_unmatched_files: true
